[package]
name = "android-usb-prep"
version = "1.0.1"
description = "Prepare USB sticks for Android TV / OTT boxes"
edition = "2021"

[lib]
name = "android_usb_prep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
